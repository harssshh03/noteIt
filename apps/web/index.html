<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eadfc6" />

    <title>NoteIt — a pocket diary</title>
    <meta name="description" content="noteIt — a pocket diary. Write it, say it out loud, send it to a friend." />

    <!-- Open Graph (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="noteIt" />
    <meta property="og:url" content="https://noteit.harssh.xyz/" />
    <meta property="og:title" content="NoteIt — a pocket diary" />
    <meta property="og:description" content="Write it down. Say it out loud. Send it on. A diary on real-feeling paper." />
    <meta property="og:image" content="https://noteit.harssh.xyz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="noteIt, a pocket diary on real-feeling paper" />

    <!-- X / Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NoteIt — a pocket diary" />
    <meta name="twitter:description" content="Write it down. Say it out loud. Send it on." />
    <meta name="twitter:image" content="https://noteit.harssh.xyz/og.png" />

    <script>
      // set the theme before first paint so there's no flash
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
